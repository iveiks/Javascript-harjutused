    let counter = 0;
    let sum = 0;
    let money = [200, 0.2, 10, 0.01, 2, 1, 0.1, 0.02, 0.05, 100, 5, 0.5, 50, 20];
    let coins = [];
    while (counter <= money.length) {

        }

    }

    const months = "Jaanuar, Veebruar, Märts, Aprill, Mai, Juuni, Juuli, August, September, Oktoober, November, Detsember";
    for (let i = 0; i < temperatures.length; i++) {

    // Kirjuta switch-case programm, mis kontrollib, kas sisestatud number on positiivne, negatiivne või null. Programm peaks väljastama vastava teate vastavalt sisestatud numbri väärtusele.
    let arv = 0;
    switch (true) {
        case (arv > 0):
            console.log("Positiivne");
            break;
        case (arv == 0):
            console.log("Null");
            break;
        case (arv < 0):
            console.log("Negatiivne");
            break;
        default:
            console.log("Mingi jama");
    }

    // Sinu ülesanne on arvutada serveri töökulu ühe tunni jooksul eurodes. Selleks peate järgima järgmisi samme:
    // Arvuta serveri voolutarbimine kilovatt-tundides (kWh) kasutades järgmist valem:
    // Voolutarbimine (kWh) = Võimsus (W) / 1000
    // Arvuta töökulu, korrutades serveri voolutarbimise elektri hinnaga:
    // Töökulu (eurodes) = Voolutarbimine (kWh) * Elektri hind (eurod/kWh)
    // Oma vastuses anna teada, kui palju maksab serveri töös hoidmine ühe tunni jooksul eurodes.
    let hind = 9.69;
    let voimsus = 400;
    let voolutarbimine = voimsus / 1000;
    let kulu = voolutarbimine * hind;
    console.log(`Serveri töökulu on ${kulu.toFixed(2)}`);
